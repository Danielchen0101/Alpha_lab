events {
    worker_connections 1024;
}

pid /tmp/nginx.pid;

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Only Create React App's content-hashed /static assets are immutable.
    # HTML, API responses and the parser-blocking theme bootstrap must never
    # survive a deployment without revalidation.
    map $uri $frontend_cache_control {
        default "no-store";
        ~^/static/ "public, max-age=31536000, immutable";
        ~^/brand/ "public, max-age=86400, must-revalidate";
        "/alphalab-email-logo.png" "public, max-age=86400, must-revalidate";
    }

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /dev/stdout main;
    error_log /dev/stderr warn;

    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    # Frontend serving
    server {
        listen 8080;
        server_name localhost;
        root /app/frontend/build;
        index index.html;

        # Frontend routes - SPA support
        location / {
            try_files $uri $uri/ /index.html;
        }

        # The parser-blocking theme bootstrap must stay in sync with index.html.
        # Do not apply the immutable cache policy used by content-hashed bundles.
        location = /theme-bootstrap.js {
            try_files $uri =404;
        }

        # API proxy to backend
        location /api/ {
            proxy_pass http://127.0.0.1:5000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 900s;
            proxy_read_timeout 900s;
        }

        # Content-hashed bundles can be cached forever. Public brand assets use
        # stable filenames and therefore receive a shorter policy below.
        location ^~ /static/ {
            try_files $uri =404;
        }

        location ^~ /brand/ {
            try_files $uri =404;
        }

        location = /alphalab-email-logo.png {
            try_files $uri =404;
        }

        # Security headers
        add_header Cache-Control $frontend_cache_control always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://api.alphalabquant.com https://nwpxjqgqegxttucsmvmp.supabase.co wss://nwpxjqgqegxttucsmvmp.supabase.co https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; frame-ancestors 'none'; form-action 'self'; manifest-src 'self'; worker-src 'self' blob:" always;
    }
}
